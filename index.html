<script>if (location.hash.startsWith('#t=')) location.replace('bilet.html' + location.hash);</script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,#1b1033,#2d1b4e 60%,#14263f);background-attachment:fixed;color:#f3eefc;min-height:100vh}
#app{max-width:1000px;margin:0 auto;padding:14px}
h1{text-align:center;margin:6px 0 2px;font-size:28px}
h2{font-size:19px;margin:0 0 10px}
.sub{text-align:center;opacity:.75;margin-bottom:10px}
.wrap{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.wrap{grid-template-columns:380px 1fr}}
.card{background:rgba(255,255,255,.07);border-radius:16px;padding:14px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.13);color:#fff;cursor:pointer}
button:active{transform:scale(.97)}button:disabled{opacity:.4}
.gold{background:linear-gradient(#ffd45c,#f0a020);color:#3a2300;font-weight:700}
.big{width:100%;padding:16px;font-size:19px;margin:6px 0}
.row{display:flex;gap:8px}.row>*{flex:1}
.stage{display:flex;flex-direction:column;align-items:center}
.barrel{width:160px;height:180px;border-radius:50%/22%;background:radial-gradient(ellipse at 35% 30%,#fff3c4,#e9b44c 55%,#a8701c);display:flex;align-items:center;justify-content:center;font-size:78px;font-weight:800;color:#5a1a00;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 -10px 20px rgba(0,0,0,.25);margin:8px 0}
.barrel.roll{animation:sh .15s infinite}@keyframes sh{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.answer{min-height:56px;font-size:22px;text-align:center;font-weight:700;margin:6px 0}
.answer small{font-size:14px;font-weight:400;opacity:.85}
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.board div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.08);font-size:14px}
.board div.on{background:#ffd45c;color:#3a2300;font-weight:700}
.board div.last{outline:3px solid #fff}
.hist div{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px}
.hist b{display:inline-block;min-width:36px;color:#ffd45c}
.tnum{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.tnum button.given{background:#2fb36b}
.over{background:#ffd45c;color:#3a2300;border-radius:14px;padding:12px;text-align:center;font-weight:700;margin:8px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:10px;z-index:9}
.modal>div{width:100%;max-width:980px;max-height:95vh;overflow:auto}
.lib .it{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.lib .it .nm{flex:1;cursor:pointer;word-break:break-word}
.lib .it button{padding:8px 11px}
.tag{font-size:11px;padding:2px 6px;border-radius:6px;background:#ffd45c;color:#3a2300;white-space:nowrap}
.tag.bad{background:#ff8a8a;color:#400}
.hint{font-size:13px;opacity:.7}
input[type=text],input[type=number]{width:100%;font:inherit;background:rgba(0,0,0,.3);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:10px}
label{display:block;margin:8px 0 4px;opacity:.85;font-size:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.qrbig{background:#fff;border-radius:14px;padding:10px;text-align:center}
.qrbig img{width:100%;max-width:520px;image-rendering:pixelated}
#print{display:none}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #app,.modal{display:none!important}
  #print{display:block}
  .one{margin:0 0 6mm;break-inside:avoid}
  .one:nth-child(2n){break-after:page}
}
/* ---- билет ---- */
.tk{display:flex;background:#fff;border:2px solid #c9a227;border-radius:6px;overflow:hidden;color:#222;font-family:Arial,sans-serif;width:100%}
.tk .side{width:62px;background:linear-gradient(#ffe9a8,#f4c542);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px;border-right:2px solid #c9a227}
.tk .logo{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:900;font-size:17px;color:#b3122e;text-align:center;line-height:1.05;letter-spacing:.5px}
.tk .meta{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;color:#5a3a00;text-align:center}
.tk .meta b{font-size:13px;color:#b3122e}
.tk .cards{flex:1;display:flex;flex-direction:column}
.tk .card{display:flex;flex:1;background:none;border-radius:0;padding:0;margin:0}
.tk .card+.card{border-top:3px solid #c9a227}
.tk .lab{writing-mode:vertical-rl;transform:rotate(180deg);background:#c9a227;color:#fff;font-size:10px;font-weight:700;text-align:center;width:16px}
.tk table{border-collapse:collapse;width:100%;table-layout:fixed}
.tk td{border:1px solid #b9b9b9;height:46px;padding:2px 3px;font-size:10px;line-height:1.15;text-align:center;vertical-align:middle;word-break:break-word;overflow:hidden;position:relative}
.tk td .no{display:block;font-size:8px;color:#999}
.tk td.pl{background:#cdf3dc}
.tk .qr{width:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:2px solid #c9a227;padding:4px;font-size:9px;color:#666;text-align:center}
.tk .qr img{width:320px;height:320px;image-rendering:pixelated}
/* ==== НЕОН-ТЕМА (цвета из презентации) ==== */
:root{--bg:#11162A;--bg2:#080A16;--txt:#F0F5FF;--cyan:#00DCFF;--pink:#FF2DB4;--gray:#858B9E}
body{font-family:'Aptos Display','Segoe UI',system-ui,Roboto,sans-serif;background:radial-gradient(ellipse at top,#1a2140,var(--bg) 45%,var(--bg2));background-attachment:fixed;color:var(--txt)}
h1{color:var(--cyan);text-transform:uppercase;letter-spacing:2px;text-shadow:0 0 12px rgba(0,220,255,.7)}
h2{color:var(--cyan)}
.sub,.hint{color:var(--gray);opacity:1}
.card{background:rgba(17,22,42,.85);border:1px solid rgba(0,220,255,.25);box-shadow:0 0 18px rgba(0,220,255,.08)}
button{background:rgba(240,245,255,.06);border:1px solid rgba(0,220,255,.35);color:var(--txt)}

.barrel{background:radial-gradient(circle at 35% 30%,#2a3358,var(--bg) 70%);border:3px solid var(--cyan);border-radius:50%;width:170px;height:170px;color:var(--cyan);text-shadow:0 0 14px var(--cyan);box-shadow:0 0 25px rgba(0,220,255,.5),inset 0 0 20px rgba(0,220,255,.2)}

.board div{background:rgba(240,245,255,.04);border:1px solid rgba(0,220,255,.3);color:var(--gray)}

.hist div{border-bottom-color:rgba(0,220,255,.12)}
.hist b{color:var(--pink)}
.tnum button.given{background:var(--cyan);color:var(--bg);border-color:var(--cyan)}

.modal .card{background:var(--bg)!important}
.tag{background:var(--cyan);color:var(--bg)}
.tag.bad{background:var(--pink);color:#fff}
.lib .it{border-bottom-color:rgba(0,220,255,.12)}

/* ---- уведомления ведущему ---- */
#notes{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:calc(100% - 20px);max-width:540px;z-index:8;display:flex;flex-direction:column;gap:6px;max-height:45vh;overflow:auto}
.note{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--cyan);border-radius:12px;padding:8px 10px;box-shadow:0 0 14px rgba(0,220,255,.45)}
.note span{flex:1;font-size:15px}
.note button{padding:6px 10px}
.note.mid{border-color:var(--pink);box-shadow:0 0 14px rgba(255,45,180,.55)}

<body>
<div id="app"></div>
<div id="print"></div>
<div id="notes"></div>
<script>
// ================= утилиты =================
const $ = s => document.querySelector(s);
const app = $('#app');
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ld = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (x) { return d; } };
const sv = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, k) => shuffle(a).slice(0, k);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };

function songName(f) {
  let n = f.replace(/\.[^.]+$/, '').replace(/^\s*\d+\s*[.)_-]\s*/, '').replace(/_/g, ' ');
  n = n.replace(/\s*[-–—]\s*/, ' — ');
  return n.replace(/\s+/g, ' ').trim();
}

// ================= хранилище песен (память браузера) =================
const DB = new Promise((res, rej) => {
  const r = indexedDB.open('muzloto', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('f');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function idb(mode, fn) {
  const d = await DB;
  return new Promise((res, rej) => {
    const tx = d.transaction('f', mode), rq = fn(tx.objectStore('f'));
    tx.oncomplete = () => res(rq && rq.result);
    tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
const idbPut = (id, b) => idb('readwrite', s => s.put(b, id));
const idbGet = id => idb('readonly', s => s.get(id));
const idbDel = id => idb('readwrite', s => s.delete(id));
const idbClear = () => idb('readwrite', s => s.clear());
const idbKeys = () => idb('readonly', s => s.getAllKeys());
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

// ================= состояние =================
let LIB = ld('mlh_lib', []);   // [{id, name}]
let SET = Object.assign({ title: 'Музыкальное лото', tickets: 10, clip: 30, leave: 3 }, ld('mlh_set', {}));
let G = ld('mlh_game', null);  // {order, tickets, drawn, given, tir, leave}
const MEM = {}; let LOST = new Set();
const saveLib = () => sv('mlh_lib', LIB), saveSet = () => sv('mlh_set', SET), saveG = () => sv('mlh_game', G);
const byId = id => LIB.find(s => s.id === id);
const nameN = n => { const s = byId(G.order[n - 1]); return s ? s.name : '?'; };
let cur = G ? 'game' : 'lib', rolling = false;

function show(s) { cur = s; render(); window.scrollTo(0, 0); }
function render() { if (cur === 'game' && G) gameScreen(); else libScreen(); }

function modal(h) {
  closeModal();
  const d = document.createElement('div'); d.className = 'modal'; d.id = 'modal';
  d.innerHTML = '<div><div class="card" style="background:#2d1b4e">' + h + '<button class="big" onclick="closeModal()">Закрыть</button></div></div>';
  document.body.appendChild(d);
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }
function busy(t) {
  let d = $('#busy');
  if (!t) { if (d) d.remove(); return; }
  if (!d) { d = document.createElement('div'); d.id = 'busy'; d.className = 'modal'; d.style.zIndex = 20; document.body.appendChild(d); }
  d.innerHTML = '<div class="card" style="background:#2d1b4e;text-align:center;max-width:340px">' + e(t) + '</div>';
}

// ================= добавление песен =================
async function addFiles(list) {
  const files = [...list].filter(f => /^audio\//.test(f.type) || /\.(mp3|m4a|aac|ogg|wav|flac|opus)$/i.test(f.name));
  const ids = []; let fail = 0, k = 0;
  for (const f of files) {
    busy('Добавляю песни: ' + (++k) + ' из ' + files.length + '…');
    const name = songName(f.name);
    const old = LIB.find(s => s.name.toLowerCase() === name.toLowerCase());
    if (old && !LOST.has(old.id)) { ids.push(old.id); continue; }
    const id = old ? old.id : 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    MEM[id] = f;
    try { await idbPut(id, f); } catch (x) { fail++; }
    if (old) LOST.delete(id); else LIB.push({ id, name });
    ids.push(id);
  }
  saveLib(); busy(null);
  if (fail) alert('Не получилось сохранить ' + fail + ' песен в память телефона. Играть можно, но после перезапуска их придётся выбрать заново.');
  return ids;
}
async function addAndShow(input) { await addFiles(input.files); input.value = ''; render(); }

function rename(id) {
  const s = byId(id); if (!s) return;
  const v = prompt('Название песни (Исполнитель — Песня):', s.name);
  if (v && v.trim()) { s.name = v.trim(); saveLib(); render(); }
}
async function delSong(id) {
  if (G && G.order.includes(id)) { alert('Эта песня сейчас в игре. Сначала замените её: «Песни и замены» в игре.'); return; }
  if (!confirm('Удалить «' + byId(id).name + '»?')) return;
  LIB = LIB.filter(s => s.id !== id); delete MEM[id]; saveLib();
  try { await idbDel(id); } catch (x) {}
  render();
}
async function delAll() {
  if (!confirm('Удалить ВСЕ песни?' + (G ? ' Текущая игра тоже закончится.' : ''))) return;
  stopA(); LIB = []; G = null; LOST = new Set(); for (const k in MEM) delete MEM[k];
  saveLib(); localStorage.removeItem('mlh_game');
  try { await idbClear(); } catch (x) {}
  show('lib');
}

// ================= экран песен и настроек =================
function readSet() {
  const t = $('#s_t'); if (!t) return;
  SET.title = t.value.trim() || 'Музыкальное лото';
  SET.tickets = clamp(Math.round(+$('#s_n').value) || 10, 1, 60);
  SET.clip = clamp(Math.round(+$('#s_c').value) || 30, 5, 120);
  SET.leave = clamp(Math.round(+$('#s_l').value) || 0, 0, 30);
  saveSet();
}
function libScreen() {
  const inGame = new Set(G ? G.order : []);
  app.innerHTML = `<h1>🎵 ${e(SET.title)}</h1><div class="sub">Пульт ведущего</div>
  ${G ? `<button class="big gold" onclick="show('game')">▶ Вернуться к игре</button>` : ''}
  <div class="card"><h2>Песни: ${LIB.length}</h2>
    <button class="big gold" onclick="$('#fi').click()">➕ Добавить песни (можно сразу много)</button>
    <input type="file" id="fi" accept="audio/*,.mp3,.m4a" multiple hidden onchange="addAndShow(this)">
    <div class="hint">В окне выбора файлов зажмите палец на одной песне, потом отметьте остальные или нажмите «Выбрать все». Лучше, чтобы файлы назывались «Исполнитель - Песня.mp3». Нажмите на название, чтобы его исправить.</div>
    <div class="lib" style="margin-top:8px">${LIB.map(s => `<div class="it">
      <span class="nm" onclick="rename('${s.id}')">${e(s.name)}
        ${inGame.has(s.id) ? '<span class="tag">в игре</span>' : ''} ${LOST.has(s.id) ? '<span class="tag bad">нет файла</span>' : ''}</span>
      <button onclick="preview('${s.id}')">▶</button><button onclick="delSong('${s.id}')">✕</button></div>`).join('') || '<div class="hint">Пока пусто</div>'}</div>
    ${LOST.size ? '<div class="hint" style="margin-top:6px">«Нет файла» — песня пропала из памяти телефона. Добавьте этот же файл ещё раз, и она вернётся.</div>' : ''}
    ${LIB.length ? `<div class="row" style="margin-top:8px"><button onclick="stopA()">⏹ Стоп</button><button onclick="delAll()">🗑 Удалить все</button></div>` : ''}
  </div>
  <div class="card"><h2>Настройки</h2>
    <label>Название лото</label><input type="text" id="s_t" value="${e(SET.title)}" onchange="readSet()">
    <div class="grid3">
      <div><label>Билетов</label><input type="number" id="s_n" min="1" max="60" value="${SET.tickets}" onchange="readSet()"></div>
      <div><label>Отрывок, сек</label><input type="number" id="s_c" min="5" max="120" value="${SET.clip}" onchange="readSet()"></div>
      <div><label>Оставить в мешке</label><input type="number" id="s_l" min="0" max="30" value="${SET.leave}" onchange="readSet()"></div>
    </div>
    <button class="big gold" onclick="newGame()" ${LIB.length >= 15 ? '' : 'disabled'}>🎫 ${G ? 'Новая игра (новые билеты)' : 'Создать билеты и начать'}</button>
    <div class="hint">Нужно минимум 15 песен, лучше 90. Если песен больше 90, в игру попадут случайные 90, остальные станут запасными для замены.</div>
  </div>`;
}

// ================= билеты как в «Русском лото» =================
function colOf(n, total) { return total === 90 ? Math.min(Math.floor(n / 10), 8) : Math.min(Math.floor((n - 1) * 9 / total), 8); }
function makeCard(total, used) {
  const cols = {}; for (let c = 0; c < 9; c++) cols[c] = [];
  for (let n = 1; n <= total; n++) if (!used.has(n)) cols[colOf(n, total)].push(n);
  const ne = range(0, 8).filter(c => cols[c].length);
  if (ne.length >= 5) for (let a = 0; a < 2000; a++) {
    const rows = [0, 1, 2].map(() => sample(ne, 5).sort((x, y) => x - y));
    const need = {}; rows.forEach(r => r.forEach(c => need[c] = (need[c] || 0) + 1));
    if (Object.keys(need).some(c => cols[c].length < need[c])) continue;
    if (total >= 60 && Object.keys(need).length < 9) continue;
    const pick = {}; for (const c in need) pick[c] = sample(cols[c], need[c]).sort((x, y) => x - y);
    const grid = [0, 1, 2].map(() => Array(9).fill(0));
    rows.forEach((r, ri) => r.forEach(c => grid[ri][c] = pick[c].shift()));
    return grid;
  }
  let pool = range(1, total).filter(n => !used.has(n));
  if (pool.length < 15) pool = range(1, total);
  const nums = sample(pool, 15), grid = [0, 1, 2].map(() => Array(9).fill(0));
  for (let ri = 0; ri < 3; ri++) {
    const cs = sample(range(0, 8), 5).sort((x, y) => x - y), vs = nums.slice(ri * 5, ri * 5 + 5).sort((x, y) => x - y);
    cs.forEach((c, j) => grid[ri][c] = vs[j]);
  }
  return grid;
}
function makeTicket(total) {
  const c1 = makeCard(total, new Set());
  const c2 = makeCard(total, total >= 30 ? new Set(c1.flat().filter(Boolean)) : new Set());
  return [c1, c2];
}
function ticketHtml(t, title, names, opts) {
  opts = opts || {};
  let h = '<div class="tk"><div class="side"><div class="logo">' + e(title) + '</div><div class="meta">Билет № <b>' + t.id + '</b><br>Тираж ' + t.tir + '</div></div><div class="cards">';
  t.c.forEach((card, ci) => {
    h += '<div class="card"><div class="lab">карточка ' + (ci + 1) + '</div><table>';
    card.forEach(row => {
      h += '<tr>' + row.map(n => !n ? '<td></td>' :
        '<td class="' + (opts.played && opts.played.has(n) ? 'pl' : '') + '">' + e(names(n)) + (opts.nums ? '<span class="no">№' + n + '</span>' : '') + '</td>').join('') + '</tr>';
    });
    h += '</table></div>';
  });
  return h + '</div>' + (opts.qr ? '<div class="qr"><img src="' + opts.qr + '"><div>Билет на телефоне</div></div>' : '') + '</div>';
}

function newGame() {
  readSet();
  if (G && G.drawn.length && !confirm('Начать новую игру? Текущая закончится, игрокам понадобятся новые билеты.')) return;
  stopA();
  const order = shuffle(LIB.map(s => s.id)).slice(0, 90), N = order.length;
  const ids = new Set(); while (ids.size < SET.tickets) ids.add(String(rnd(1000000, 9999999)));
  const tir = rnd(1000, 9999);
  G = { order, drawn: [], given: [], tir, leave: Math.min(SET.leave, N - 1),
        tickets: [...ids].map(id => ({ id, tir, c: makeTicket(N) })) };
  saveG(); NOTES = []; drawNotes(); show('game');
}

// ================= ссылки и QR =================
async function linkFor(i) {
  const t = G.tickets[i], s = {};
  t.c.forEach(c => c.forEach(r => r.forEach(n => { if (n) s[n] = nameN(n); })));
  const json = JSON.stringify({ title: SET.title, id: t.id, tir: t.tir, c: t.c, s });
  const buf = await new Response(new Blob([new TextEncoder().encode(json)]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer();
  let bin = ''; new Uint8Array(buf).forEach(b => bin += String.fromCharCode(b));
  return new URL('bilet.html', location.href).href + '#t=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function qrImg(url, cell) { try { const q = qrcode(0, 'L'); q.addData(url); q.make(); return q.createDataURL(cell, 4); } catch (x) { return ''; } }

function ticketsList() {
  modal(`<h2>Билеты: нажмите номер и покажите QR-код игроку</h2>
   <div class="tnum">${G.tickets.map((t, i) => `<button class="${G.given.includes(i) ? 'given' : ''}" onclick="qrShow(${i})">${i + 1}${G.given.includes(i) ? ' ✓' : ''}</button>`).join('')}</div>
   <div class="hint" style="margin-top:8px">✓ — билет уже выдан. Для QR-кодов нужен интернет.</div>`);
}
async function qrShow(i) {
  const url = await linkFor(i), img = qrImg(url, 8);
  if (!G.given.includes(i)) { G.given.push(i); saveG(); }
  modal(`<h2>Билет ${i + 1} (№${G.tickets[i].id})</h2>
   <div class="qrbig">${img ? `<img src="${img}" alt="QR">` : '<div style="color:#000;padding:20px">QR-код не построился. Проверьте интернет и откройте пульт заново.</div>'}</div>
   <div class="row" style="margin-top:8px">${i > 0 ? `<button onclick="qrShow(${i - 1})">◀ ${i}</button>` : ''}${i < G.tickets.length - 1 ? `<button onclick="qrShow(${i + 1})">${i + 2} ▶</button>` : ''}</div>
   <div class="row" style="margin-top:8px"><button onclick="shareT(${i})">📤 Ссылкой</button><button onclick="ticketsList()">Все билеты</button></div>`);
}
async function shareT(i) {
  const url = await linkFor(i);
  if (navigator.share) { try { await navigator.share({ title: 'Билет ' + (i + 1) + ' — ' + SET.title, url }); return; } catch (x) { if (x.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(url); alert('Ссылка скопирована'); } catch (x) { prompt('Скопируйте ссылку:', url); }
}
async function printAll() {
  busy('Готовлю билеты для печати…');
  let h = '';
  for (let i = 0; i < G.tickets.length; i++) h += '<div class="one">' + ticketHtml(G.tickets[i], SET.title, nameN, { qr: qrImg(await linkFor(i), 10) }) + '</div>';
  $('#print').innerHTML = h; busy(null);
  setTimeout(() => window.print(), 300);
}
function check(i) {
  const played = new Set(G.drawn), t = G.tickets[i];
  const all = t.c.flat(2).filter(Boolean), hit = all.filter(n => played.has(n)).length;
  modal(`<h2>Билет ${i + 1} (№${t.id}): зелёным — уже звучали, ${hit} из ${all.length}</h2>${ticketHtml(t, SET.title, nameN, { played, nums: true })}`);
}

// ================= замена песен =================
function songsModal() {
  const last = G.drawn[G.drawn.length - 1];
  modal(`<h2>Песни в игре</h2><div class="hint" style="margin-bottom:8px">Заменить можно песню, которая ещё не выпала, и последнюю выпавшую.</div>
   <div class="lib">${G.order.map((id, k) => { const n = k + 1, can = !G.drawn.includes(n) || n === last;
     return `<div class="it"><b style="min-width:30px;color:#ffd45c">${n}</b><span class="nm">${e(nameN(n))}</span>${can ? `<button onclick="replaceAsk(${n})">🔄</button>` : '<span class="hint">звучала</span>'}</div>`; }).join('')}</div>`);
}
function replaceAsk(n) {
  if (!n) return;
  const inGame = new Set(G.order), reserve = LIB.filter(s => !inGame.has(s.id) && !LOST.has(s.id));
  modal(`<h2>Замена №${n}</h2><div style="margin-bottom:8px">Сейчас: <b>${e(nameN(n))}</b></div>
   <button class="big gold" onclick="$('#rf').click()">📁 Выбрать песню с телефона</button>
   <input type="file" id="rf" accept="audio/*,.mp3,.m4a" hidden onchange="replaceFile(${n},this)">
   ${reserve.length ? `<h2 style="margin-top:12px">или из запасных</h2><div class="lib">${reserve.map(s => `<div class="it"><span class="nm">${e(s.name)}</span>
     <button onclick="preview('${s.id}')">▶</button><button class="gold" onclick="doReplace(${n},'${s.id}')">Взять</button></div>`).join('')}</div>` : ''}`);
}
async function replaceFile(n, input) {
  const ids = await addFiles(input.files);
  if (!ids.length) return;
  if (G.order.includes(ids[0])) { alert('Эта песня уже есть в игре.'); return; }
  doReplace(n, ids[0]);
}
function doReplace(n, id) {
  const last = G.drawn[G.drawn.length - 1];
  G.order[n - 1] = id;
  const hit = []; G.tickets.forEach((t, i) => { if (t.c.flat(2).includes(n)) hit.push(i); });
  const givenHit = hit.filter(i => G.given.includes(i));
  G.given = G.given.filter(i => !hit.includes(i));
  saveG(); closeModal(); stopA(); render();
  alert(givenHit.length
    ? 'Готово. Эта песня есть в билетах: ' + givenHit.map(i => i + 1).join(', ') + '. Покажите этим игрокам их QR-коды ещё раз (кнопка «Билеты»). Отметки у них сохранятся.'
    : 'Готово, песня заменена.');
  if (n === last) playN(n);
}

// ================= звук =================
const audio = new Audio();
let stopT = null, fadeI = null, curId = null, curUrl = null, startAt = null;
async function getBlob(id) {
  if (MEM[id]) return MEM[id];
  try { const b = await idbGet(id); if (b) MEM[id] = b; return b; } catch (x) { return null; }
}
function msg(h) { const a = $('#ans'); if (a) a.innerHTML = h; }
async function playId(id, secs, again, n) {
  clearTimeout(stopT); clearInterval(fadeI);
  const b = await getBlob(id);
  if (!b) { if (n) msg(e(nameN(n)) + '<br><small>⚠ Файл не найден: нажмите «Заменить» или добавьте песню заново</small>'); else alert('Файл не найден, добавьте песню заново'); return; }
  if (curId !== id) { if (curUrl) URL.revokeObjectURL(curUrl); curUrl = URL.createObjectURL(b); curId = id; audio.src = curUrl; startAt = null; }
  else if (!again) startAt = null;
  audio.muted = false; audio.volume = 1;
  const go = () => {
    const d = audio.duration;
    if (startAt == null) startAt = (isFinite(d) && d > secs + 15) ? d * (0.25 + Math.random() * 0.2) : 0;
    try { audio.currentTime = startAt; } catch (x) {}
    audio.play().catch(() => { if (n) msg(e(nameN(n)) + '<br><small>▶ Нажмите «Ещё раз», чтобы включить звук</small>'); });
    stopT = setTimeout(fade, secs * 1000);
  };
  if (audio.readyState >= 1) go(); else audio.addEventListener('loadedmetadata', go, { once: true });
}
function playN(n, again) { if (n) playId(G.order[n - 1], SET.clip, again, n); }
function preview(id) { playId(id, 12, false, 0); }
function fade() { let v = 1; clearInterval(fadeI); fadeI = setInterval(() => { v -= .1; if (v <= 0) { clearInterval(fadeI); audio.pause(); audio.volume = 1; } else audio.volume = v; }, 80); }
function stopA() { clearTimeout(stopT); clearInterval(fadeI); audio.pause(); audio.volume = 1; }

// ================= игра =================
function gameScreen() {
  const N = G.order.length, LIMIT = Math.max(1, N - G.leave), last = G.drawn[G.drawn.length - 1], over = G.drawn.length >= LIMIT;
  const hist = G.drawn.slice().reverse();
  app.innerHTML = `<h1>🎵 ${e(SET.title)}</h1><div class="sub">Тираж ${G.tir} · песен ${N} · в мешке останется ${G.leave}</div>
  ${location.protocol !== 'https:' ? '<div class="over">Откройте пульт по ссылке на сайт, иначе QR-коды билетов не будут работать</div>' : ''}
  <div class="wrap"><div>
    <div class="card stage">
      <div class="barrel" id="barrel">${last || '?'}</div>
      <div class="answer" id="ans">${last ? e(nameN(last)) : ''}</div>
      <button class="big gold" id="draw" onclick="draw()" ${over ? 'disabled' : ''}>🎲 Достать бочонок</button>
      <div class="row" style="width:100%">
        <button onclick="playN(${last || 0},true)" ${last ? '' : 'disabled'}>🔁 Ещё раз</button>
        <button onclick="stopA()">⏹ Стоп</button>
        <button onclick="replaceAsk(${last || 0})" ${last ? '' : 'disabled'}>🔄 Заменить</button>
      </div>
      <div style="margin-top:8px;opacity:.75">Выпало ${G.drawn.length} из ${LIMIT}</div>
      ${over ? `<div class="over">Игра окончена! В мешке остались бочонки: ${G.leave}</div>` : ''}
    </div>
    <div class="card">
      <button class="big gold" onclick="ticketsList()">🎫 Билеты (QR для игроков)</button>
      <div class="row"><button onclick="printAll()">🖨 Печать</button><button onclick="songsModal()">🎵 Песни и замены</button></div>
    </div>
    <div class="card"><h2>Проверить билет</h2>
      <div class="tnum">${G.tickets.map((t, i) => `<button onclick="check(${i})">${i + 1}</button>`).join('')}</div></div>
    <div class="card"><div class="row"><button onclick="show('lib')">📚 Все песни</button><button onclick="reset()">↺ Сначала</button></div>
      <div class="hint" style="margin-top:6px">«Сначала» — сбросить бочонки, билеты остаются те же. Новые билеты: «Все песни» → «Новая игра».</div></div>
  </div><div>
    <div class="card"><div class="board">${range(1, N).map(n => `<div class="${G.drawn.includes(n) ? 'on' : ''} ${n === last ? 'last' : ''}">${n}</div>`).join('')}</div></div>
    <div class="card hist"><h2>Уже звучали</h2>${hist.map(n => `<div><b>${n}</b>${e(nameN(n))}</div>`).join('') || '<div class="hint">Пока ничего</div>'}</div>
  </div></div>`;
}
function draw() {
  const N = G.order.length, LIMIT = Math.max(1, N - G.leave);
  if (rolling || G.drawn.length >= LIMIT) return;
  const rest = range(1, N).filter(n => !G.drawn.includes(n));
  const n = rest[Math.floor(Math.random() * rest.length)];
  stopA();
  if (audio.src) { audio.muted = true; audio.play().catch(() => {}); }  // разблокировка звука на телефоне
  getBlob(G.order[n - 1]);                                             // заранее подгружаем песню
  rolling = true;
  const b = $('#barrel'); b.classList.add('roll'); msg(''); $('#draw').disabled = true;
  const iv = setInterval(() => b.textContent = rest[Math.floor(Math.random() * rest.length)], 70);
  setTimeout(() => {
    clearInterval(iv); rolling = false;
    G.drawn.push(n); saveG(); render(); playN(n); checkWins(n);
    navigator.vibrate && navigator.vibrate(40);
  }, 1600);
}
function reset() { if (confirm('Сбросить выпавшие бочонки и начать игру заново? Билеты останутся те же.')) { stopA(); G.drawn = []; saveG(); NOTES = []; drawNotes(); render(); } }

// ================= уведомления: кто что закрыл =================
let NOTES = [], noteSeq = 0;
function checkWins(n) {
  const d = new Set(G.drawn), full = r => r.every(x => !x || d.has(x));
  G.tickets.forEach((t, i) => {
    if (!t.c.flat(2).includes(n)) return;
    let rows = 0, cards = 0;
    t.c.forEach(c => {
      c.forEach(r => { if (r.includes(n) && full(r)) rows++; });
      if (c.flat().includes(n) && c.every(full)) cards++;
    });
    const all = t.c.every(c => c.every(full));
    const txt = all ? 'закрыл ВЕСЬ БИЛЕТ 🏆' : cards ? 'закрыл карточку 🎉' : rows > 1 ? 'закрыл ' + rows + ' строки ⭐' : rows ? 'закрыл строку ⭐' : '';
    if (txt) NOTES.push({ id: ++noteSeq, i, cls: all ? 'top' : cards ? 'mid' : '', h: 'Билет ' + (i + 1) + ' (№' + t.id + ') ' + txt });
  });
  drawNotes();
}
function drawNotes() {
  const b = $('#notes'); if (!b) return;
  b.innerHTML = NOTES.map(x => `<div class="note ${x.cls}"><span>${e(x.h)}</span><button onclick="check(${x.i})" title="Проверить">🔍</button><button onclick="closeNote(${x.id})">✕</button></div>`).join('')
    + (NOTES.length > 1 ? '<button class="noteall" onclick="NOTES=[];drawNotes()">Закрыть все</button>' : '');
}
function closeNote(id) { NOTES = NOTES.filter(x => x.id !== id); drawNotes(); }

// ================= старт =================
render();
(async () => {
  try {
    const ks = new Set(await idbKeys());
    LIB.forEach(s => { if (!ks.has(s.id) && !MEM[s.id]) LOST.add(s.id); });
    if (LOST.size) render();
  } catch (x) {}
})();
</script>
</body>
