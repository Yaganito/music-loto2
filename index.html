<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1b1033">
<title>Музыкальное лото</title>
<script>
  // если открыли главную со ссылкой на билет — перекинуть на страницу билета
  if (location.hash.length > 3 || location.search.length > 1) {
    location.replace('bilet.html' + location.search + location.hash);
  }
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#1b1033,#2d1b4e 60%,#14263f);color:#f3eefc;text-align:center;padding:20px;box-sizing:border-box}
  .box{max-width:420px}
  .icon{font-size:80px;margin-bottom:10px}
  h1{font-size:30px;margin:0 0 12px}
  p{font-size:18px;opacity:.85;line-height:1.4;margin:8px 0}
  .card{background:rgba(255,255,255,.08);border-radius:16px;padding:16px;margin-top:20px}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">🎵</div>
    <h1>Музыкальное лото</h1>
    <p>Чтобы открыть свой билет, отсканируйте QR-код камерой телефона.</p>
    <div class="card">
      <p>📷 Наведите камеру на QR-код билета<br>✍️ Услышали песню из билета — нажмите на неё<br>🎉 Закрыли ряд — кричите «Лото!»</p>
    </div>
  </div>
</body>
</html>
